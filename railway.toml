# -- AquaSentinel Backend - Railway Config ----------------------------------
[build]
builder = "dockerfile"
dockerfilePath = "rainfall_early_warning/backend/Dockerfile"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port "
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
